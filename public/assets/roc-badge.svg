<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="240" height="280" role="img" aria-label="ROC 585 Rochester New York badge">
  <title>ROC 585 — Rochester, NY</title>

  <!-- Deliberately a patch, not a seal: no circular civic frame, no official
       lettering ring. Original mark built from Rochester's own iconography,
       the lilac and the skyline, in this site's cartoon style. -->

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D7B0D7"/>
      <stop offset="55%" stop-color="#EFD9EF"/>
      <stop offset="100%" stop-color="#FFF6E2"/>
    </linearGradient>
    <clipPath id="inner">
      <path d="M120 14 L214 44 v104 c0 54-46 84-94 104 C72 232 26 202 26 148 V44 Z"/>
    </clipPath>
  </defs>

  <!-- patch body -->
  <path d="M120 6 L222 39 v109 c0 60-51 92-102 114 C69 240 18 208 18 148 V39 Z"
        fill="#1E3A54"/>
  <path d="M120 14 L214 44 v104 c0 54-46 84-94 104 C72 232 26 202 26 148 V44 Z"
        fill="url(#sky)"/>

  <g clip-path="url(#inner)">
    <!-- skyline: Kodak Tower's stepped crown, the Wings of Progress, Xerox slab -->
    <g fill="#1E3A54">
      <rect x="34" y="150" width="30" height="52"/>
      <rect x="70" y="132" width="20" height="70"/>
      <polygon points="70,132 80,116 90,132"/>
      <rect x="79" y="106" width="2" height="12"/>
      <rect x="98" y="144" width="26" height="58"/>
      <polygon points="98,144 95,128 104,140"/>
      <polygon points="124,144 127,128 118,140"/>
      <rect x="132" y="120" width="30" height="82"/>
      <rect x="170" y="140" width="24" height="62"/>
      <polygon points="196,202 196,152 214,144 214,202"/>
    </g>
    <!-- lit windows -->
    <g fill="#F5A62B">
      <rect x="42" y="162" width="4" height="6"/><rect x="52" y="176" width="4" height="6"/>
      <rect x="140" y="132" width="4" height="6"/><rect x="140" y="152" width="4" height="6"/>
      <rect x="150" y="142" width="4" height="6"/><rect x="106" y="158" width="4" height="6"/>
      <rect x="176" y="154" width="4" height="6"/>
    </g>
    <!-- ground -->
    <rect x="18" y="200" width="204" height="60" fill="#6E9455"/>
    <rect x="18" y="200" width="204" height="5" fill="#1E3A54"/>
  </g>

  <!-- lilac sprigs, the Highland Park note -->
  <g>
    <g transform="translate(44,96) rotate(-16)">
      <path d="M0 34 C-2 20 -2 10 0 0" stroke="#4E7A3E" stroke-width="4" fill="none" stroke-linecap="round"/>
      <g fill="#CAA6CA" stroke="#57354F" stroke-width="2">
        <circle cx="0" cy="-2" r="6"/><circle cx="-8" cy="6" r="5.5"/><circle cx="8" cy="6" r="5.5"/>
        <circle cx="-4" cy="15" r="5"/><circle cx="5" cy="15" r="5"/><circle cx="0" cy="24" r="4.5"/>
      </g>
    </g>
    <g transform="translate(196,96) rotate(16)">
      <path d="M0 34 C2 20 2 10 0 0" stroke="#4E7A3E" stroke-width="4" fill="none" stroke-linecap="round"/>
      <g fill="#CAA6CA" stroke="#57354F" stroke-width="2">
        <circle cx="0" cy="-2" r="6"/><circle cx="-8" cy="6" r="5.5"/><circle cx="8" cy="6" r="5.5"/>
        <circle cx="-4" cy="15" r="5"/><circle cx="5" cy="15" r="5"/><circle cx="0" cy="24" r="4.5"/>
      </g>
    </g>
  </g>

  <!-- ROC -->
  <text x="120" y="120" text-anchor="middle"
        font-family="'Titan One', system-ui, sans-serif" font-size="62"
        fill="#F5A62B" stroke="#1E3A54" stroke-width="7" paint-order="stroke" letter-spacing="2">ROC</text>

  <!-- 585 banner -->
  <g>
    <path d="M40 214 h160 l-12 20 h-136 Z" fill="#D9482B" stroke="#1E3A54" stroke-width="5" stroke-linejoin="round"/>
    <text x="120" y="231" text-anchor="middle"
          font-family="'Space Mono', ui-monospace, monospace" font-size="16" font-weight="700"
          fill="#FFF6E2" letter-spacing="6">585</text>
  </g>
</svg>
