# Does the commit that just landed contain the pages its own source produces?
#
# WHY THIS EXISTS, AND WHY IT IS SEPARATE FROM THE DEPLOY. public/ is generated
# AND committed, so a commit can change a builder and change not one page, and
# every existing gate still reports success: build-all exits 0 because it builds
# the working tree, and check-build.py exits 0 because it reads public/ from
# disk and public/ is a perfectly good build of the PREVIOUS source. Neither can
# see the gap between them.
#
# IT HAPPENED THREE TIMES ON 19 AUGUST 2026 and twice more on 20 August. The
# worst of them left 1,026 /pokemon/ pages, two thirds of the site, live and
# built from a builder that had since changed. Every one was caught by somebody
# happening to fetch the live file rather than trusting the commit.
#
# scripts/check-tree-drift.mjs has existed since then and was wired to NOTHING:
# not this workflow, not build-all.mjs, and named in none of CLAUDE.md,
# DEPLOY.md, LAUNCH.md or LAUNCH-DAY.md. Found by an audit on launch day. The
# only defence against this repo's worst documented failure mode was a script
# nobody was told to run.
#
# IT DOES NOT BLOCK THE DEPLOY, ON PURPOSE. Publishing a slightly stale page is
# worse than not publishing, but publishing NOTHING because a check is having a
# bad day is worse than both, and the deploy workflow has its own hard-won
# reasoning about concurrency and timeouts that this must not complicate. This
# runs alongside and goes red. A red tick beside a green deploy is exactly the
# signal wanted: the site is up, and it is not what the source says.
name: Verify the committed tree

on:
  push:
    branches: [main]
  # AND ON A CLOCK, because the freshness check below is useless without it.
  # It only ever ran on push, and the nightly refresh IS this repo's main
  # pusher: on 27 and 28 August 2026 the nightly did not fire, so nothing was
  # pushed, so nothing checked that nothing had been pushed. 16:40 UTC is after
  # both nightly crons and their observed 3 hour delay -- comfortably so since
  # 8 September 2026, when those crons moved from 13:17/14:17 to 07:17/08:17
  # and the latest a nightly can now arrive became about 11:20 UTC. Left at
  # 16:40 on purpose: the wide margin costs nothing, and a midday check also
  # catches drift pushed by hand during the morning.
  #
  # CORRECTION, 11 NOVEMBER 2026: "observed 3 hour delay" is stale. Over the 20
  # nightly runs to that date the nightly landed between 12:00 and 18:55 UTC (a
  # median of 7 hours after its booking), and this workflow's own 16:40 booking
  # started between 19:00 and 00:25 UTC. So this still runs after the nightly on
  # nearly every day measured, but only because it is late as well. If GitHub ever
  # starts running this one on time, move the cron to 21:40.
  schedule:
    - cron: "40 16 * * *"
  workflow_dispatch:

# issues: write is for the two alerts at the foot of the job, which open,
# comment on and close one issue each through scripts/alert-issue.sh.
permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # FULL HISTORY, NOT A SHALLOW CLONE. The check exports HEAD with
      # `git archive`, which needs the commit's tree; a depth-1 clone has it,
      # but --staged and any future comparison against a parent do not.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # THE IMAGE BUILDERS DO NOT RUN HERE, and that is the whole reason this
      # job can give a straight answer. build-og-pages.py and sync-symbols.mjs
      # rewrite their files on every run, so a runner with a different Pillow,
      # a different libjpeg or a font Google has re-released since produces
      # different bytes from the same source -- and since every og:image URL
      # carries a content hash, changed images restamp the pages that reference
      # them. This job reported 1,092 drifted files for a commit that changed
      # two lines of one meta description, which is a checker crying wolf.
      #
      # Skipping them leaves the committed images in place for stamp-assets to
      # hash, so the HTML comes out byte-identical and any real drift in it
      # still fails the job. That is the failure this exists to catch: all five
      # August incidents were stale HTML, not stale images.
      #
      # Verified locally that the two modes agree: with the flag set,
      # check-tree-drift reports no drift across all 6,395 files.
      # THE SITE BAKES "TODAY" INTO ITS HTML, so this job has to ask the question
      # in the same timezone the tree was built in. index.html carries
      # data-built="2026-08-24" and relative ages like "3 MONTHS AGO" and
      # "YESTERDAY"; card-shows.html counts the days to the next show. Under UTC
      # a runner one minute past midnight in London is already tomorrow in
      # Rochester, and it reported card-shows.html and index.html as drifted for
      # a commit that touched neither -- the push that proved it ran at 03:11
      # UTC, which is 23:11 the PREVIOUS day in New York, the same day the tree
      # was actually built.
      #
      # America/New_York is where the channel is and where the builds happen, so
      # it is the clock the committed HTML is written against. This does not
      # make the tree reproducible forever -- rebuild it tomorrow and the ages
      # move, by design -- but CI runs seconds after the push, so same-day is
      # the normal case and a genuine day-boundary miss is a real "rebuild me"
      # signal rather than noise.
      - name: Does public/ match the source committed beside it?
        env:
          GR_SKIP_IMAGE_BUILDERS: '1'
          TZ: America/New_York
        run: node scripts/check-tree-drift.mjs --diff

      # LAST, AND THAT IS DELIBERATE. This step and the drift check share a job
      # under `bash -e`, so putting freshness first meant a stale DATE stopped
      # the drift check from ever running, and this file's own header calls
      # drift "the only defence against this repo's worst documented failure
      # mode". A date is worth less than that, so it goes behind it.
      #
      # TZ, because the stamps are written by localDay() in New York and a
      # runner is UTC: an evening push would otherwise read every file as a day
      # older than it is and fail intermittently against a 3 day leash.
      # always(): on a day the nightly made no commit the drift step above
      # fails on the calendar alone and used to skip this one, so the log said
      # "drift" when the truth was "the nightly did not run".
      - name: Is the data the nightly owns still fresh?
        if: always()
        env:
          TZ: America/New_York
        run: node scripts/check-freshness.mjs

      # IS THE SITE THE COMMIT, AND DID THE NIGHTLY COMMIT? Added 11 November
      # 2026; the reasons are in the header of scripts/check-live.sh. Two
      # separate questions, two separate issues, both closed again by the
      # first run that finds them healthy.
      #
      # NOT ON A PUSH. A push run starts seconds after the commit lands, when
      # the deploy it triggered cannot have finished, so the answer would
      # always be "in flight". The schedule and a manual run are the two that
      # can say something. The comparison is written as != 'push' rather than
      # == 'schedule' so a manual run can be used to test it.
      #
      # always(): this must report on exactly the days the steps above are red.
      # It goes last so a red here never hides drift or freshness.
      - name: Is the live site this commit, and did the nightly commit?
        if: always() && github.event_name != 'push'
        env:
          TZ: America/New_York
          ALERT: '1'
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/check-live.sh
