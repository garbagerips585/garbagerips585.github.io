# Nightly refresh: pull new videos and new prices, rebuild, commit.
#
# The site is static HTML with every price baked in at build time, so without
# this nothing ever changes on its own: a new upload does not appear and a
# price is however old the last manual run was. Deploy is a separate workflow
# that fires on any push to main, so committing here is what publishes.
#
# BOOKED for 3am in Rochester, and it does NOT run then. Measured 11 November
# 2026 over the last 20 runs: GitHub starts it a median of 7 hours late (5 to
# 10), so it lands between 8am and 2pm Eastern. Plan around that, not around
# the cron. It is scheduled as TWO crons, 07:17 and 08:17 UTC, and a guard in
# the job ends the run on whichever one is not the 3am Eastern booking that
# day, so the booking is fixed LOCALLY and a change to the daylight saving
# rules needs no edit. See the schedule and the guard below.
#
# (This said "07:10 UTC, about 3am in Rochester" until 19 August 2026, which was
# contradicted by the cron twenty lines below it in this same file. DEPLOY.md
# carried the same stale claim and was corrected without this being noticed.
# It then genuinely was 9am Eastern from 19 August to 8 September 2026.)
#
# SECRETS THIS NEEDS  (Settings -> Secrets and variables -> Actions)
#   YT_API_KEY    YouTube Data API v3, for new uploads
#   PPT_API_KEY   pokemonpricetracker.com, for PSA 10 prices
# Both steps are skipped automatically when their secret is absent, so the
# TCGplayer half still runs on a fork or before the keys are added.
name: Nightly refresh

# Booked for 3am Eastern, every day. Lands 8am to 2pm Eastern (see the
# correction dated 11 November 2026 a few paragraphs down).
#
# THE OWNER ASKED FOR 9am ON 17 AUGUST 2026 AND NEVER ONCE GOT IT. GitHub runs
# scheduled jobs late, and measured here that lateness was 54 minutes to 3
# hours 3 minutes, so a 13:17 booking actually arrived at 15:26, 16:36 and
# 16:55 UTC -- 11:26am, 12:36pm and 12:55pm in Rochester. The request was for a
# morning refresh and what it produced was a lunchtime one.
#
# THAT LUNCHTIME LANDING IS THE PROBLEM, not the hour on paper. This job
# force-pushes a rebuild of ~1,400 pages, so arriving in the middle of a
# working session puts it in direct contention with whoever is editing. It
# collided with in-flight work on three consecutive days, 5 to 7 September
# 2026. Nothing was lost, but only because each collision was caught by hand:
# reset to the bot's tree, re-apply the source files, rebuild, re-verify that
# no price regressed. The recovery is fiddly and the failure mode is silent.
#
# The push loop below already resolves a race correctly on the BOT's side --
# take theirs, rebuild, retry. It cannot do anything about a human's unpushed
# local commits, and that is the half that actually hurts. Moving the run out
# of waking hours removes the overlap instead of handling it.
#
# 3:17am plus GitHub's worst measured 3 hours still lands by 6:20am Eastern,
# which is earlier than any run this schedule has ever actually produced and
# well before the day starts. The site is fresh when the owner wakes up, which
# is what "9am" was asking for in the first place.
#
# CORRECTION, 11 NOVEMBER 2026: THE THREE PARAGRAPHS ABOVE DID NOT HOLD. "Worst
# measured 3 hours" was five runs in August. Over the 20 runs to 11 November
# the 08:17 UTC booking started between 12:02 and 18:44 UTC: a median of 7
# hours late, never under 4, so the job lands at 8am to 2pm Eastern, which is
# the working session the move to 3am was meant to avoid. The push race is
# therefore the LIKELY case again. It is handled in scripts/nightly-push.sh,
# which since the same day keeps the night's synced data through a race instead
# of dropping it. The history above is left as written.
#
# GITHUB CRON IS UTC AND HAS NO CONCEPT OF DAYLIGHT SAVING, so one line cannot
# be 3am Eastern all year. Two are scheduled instead, 07:17 and 08:17 UTC, and
# the job's first step exits early on whichever one is not 3am in New York
# today. That keeps it at 3am through both halves of the year rather than
# drifting to 2am every November.
#
# GitHub also runs scheduled jobs late when the fleet is busy, sometimes by
# tens of minutes, and drops them entirely on a repository with no activity for
# 60 days. Neither is fixable from here; workflow_dispatch below is the manual
# fallback and the sync is safe to run twice.
on:
  schedule:
    # NOT ON THE HOUR, AND THAT IS THE WHOLE REASON THESE READ 07:17 / 08:17.
    # GitHub queues every "0 * * * *" job in the world at once, so a run booked
    # on the hour is delayed and, under load, DROPPED. Measured here: the runs
    # that did fire started 2.5 to 3 hours late (15:26, 16:36, 16:55 UTC), and
    # on 27 and 28 August 2026 neither cron fired at all, so the site went two
    # days with no refresh and nothing went red. Seventeen past is quiet.
    - cron: "17 7 * * *"
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      force_prices:
        description: "Refetch TCGplayer prices even if cached"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  # WHICH CRON IS 3am IN NEW YORK IS DECIDED BY THE DST OFFSET, NOT BY THE CLOCK
  # WHEN THE JOB HAPPENS TO START. An older guard asked the runner what hour it
  # was and stopped unless the answer was the hour it wanted. GitHub then ran
  # these crons late -- measured over five days, between 54 minutes and 3 hours
  # 3 minutes late -- so on three of those five days BOTH crons woke up past
  # the wanted hour and the refresh never ran at all. That trap gets WORSE at
  # 3am, not better, because a late run crosses into the next hour just the
  # same; reading the clock is the wrong test at any hour.
  #
  # github.event.schedule NAMES THE CRON THAT FIRED, and it is stamped at
  # trigger time, so a late start cannot change it. Pair that with the current
  # UTC offset -- -0400 in summer, -0500 in winter -- and exactly one of the two
  # crons is the 3am one on any given day, however late either arrives.
  #
  # AND SKIPPING IS NOT FAILING. The old guard called `exit 1` on the cron it
  # did not want, so this workflow went red EVERY SINGLE DAY as designed. That
  # is why nobody noticed it had also been genuinely broken since 20 August: a
  # real failure looked exactly like the normal one. A gate job that outputs a
  # flag leaves the unwanted run marked "skipped", so red means broken again.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.decide.outputs.go }}
    steps:
      - id: decide
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual run; never gated."
            echo "go=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          offset=$(TZ=America/New_York date +%z)
          if [ "$offset" = "-0500" ]; then want="17 8 * * *"; else want="17 7 * * *"; fi
          fired="${{ github.event.schedule }}"
          echo "New York offset $offset, so the 3am cron today is '$want'. This run is '$fired'."
          if [ "$fired" = "$want" ]; then
            echo "go=1" >> "$GITHUB_OUTPUT"
          else
            echo "Not today's 3am cron. Skipping, which is not a failure."
            echo "go=0" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    # Same reasoning as the timeout in pages.yml, and it matters more here:
    # this workflow is what TRIGGERS the deploy, so a run wedged in this
    # concurrency group stops publishing just as completely as a wedged deploy
    # does, and just as quietly. Generous, because the job talks to the
    # YouTube and PriceCharting APIs and then rebuilds ~1,480 pages.
    # 45 MINUTES WAS SIZED FOR A WARM CACHE AND KILLED THE ONLY RUN THAT COULD
    # HAVE REWARMED IT. Measured: a run with the cache restored finishes in
    # SIX minutes (25 and 26 August). The 29th failed at its push and, because
    # save-always had silently become a no-op in actions/cache 4.2, saved no
    # cache. The 30th therefore started cold, spent 45 minutes inside "Card
    # checklists and prices" against a rate-limited TCGdex, and was cancelled at
    # this ceiling -- saving no cache either. Each failure guaranteed the next
    # one, and prices stopped moving for five days.
    #
    # The explicit cache save at the foot of this job breaks the loop, but a
    # cold recovery run still needs room to finish: the 29th had reached 36
    # minutes and was not done. Ninety gives a cold run headroom and still stops
    # a wedged one, and a healthy night is unaffected because it takes six.
    timeout-minutes: 90
    # Job level, not step level: a step's own env: block is NOT in scope for
    # that step's own if:, so the skip-when-absent guards below would never
    # fire and the steps would run keyless and fail.
    env:
      YT_API_KEY: ${{ secrets.YT_API_KEY }}
      PPT_API_KEY: ${{ secrets.PPT_API_KEY }}
      # shared/today.mjs reads the process timezone. Without this the job ran
      # in UTC, so a run after 7pm Eastern stamped tomorrow's date on every
      # page while verify.yml and a local build (both New York) disagreed.
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4

      # NOTHING ASKS PRICECHARTING FOR ANYTHING, from 13 November 2026. Every
      # node process after this step loads shared/no-pricecharting.mjs first,
      # which refuses any request to pricecharting.com. Set here and not as a
      # workflow-level env, because the checkout above runs on node too and the
      # file does not exist until it has run. Read that file before removing.
      - name: Refuse every request to PriceCharting
        run: echo "NODE_OPTIONS=--import $GITHUB_WORKSPACE/shared/no-pricecharting.mjs" >> "$GITHUB_ENV"

      # 24, THE SAME MAJOR AS verify.yml, pages.yml AND THE OWNER'S MACHINE. This
      # was 22 until 11 November 2026, so the nightly built the tree on one
      # Node and verify.yml rebuilt it on another to decide whether it had
      # drifted. Nothing in scripts/ needs 22 (no package.json, no engines
      # field, no native module); local builds and every drift check already
      # run on 24.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # PYTHON AND PILLOW, BECAUSE build-all.mjs RUNS A PYTHON BUILDER.
      # scripts/build-og-pages.py draws the per-page social cards and imports
      # PIL. Without this the runner has no Pillow, that builder throws
      # ModuleNotFoundError, build-all.mjs exits 1, and the commit step is
      # skipped, so every sync above it runs successfully and is then thrown
      # away. That is what happened on 13, 14 and 15 August 2026: three
      # consecutive nightly runs did all the work and committed nothing.
      # If you add another Python builder, check its imports are installed here.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PINNED, AND SOFT, both since 11 November 2026.
      # Pinned: an unpinned install takes whatever PyPI released that morning,
      # and a new Pillow is a new JPEG encoder, which redraws every share card
      # and restamps every page that links one. 13.0.0 is what had been
      # resolving here since its release on 16 October 2026 (PyPI, read 11
      # November; the step ran --quiet, so the logs never named it). Raise it
      # on purpose, in a commit, not by accident.
      # Soft: PyPI being down used to end the night before a single price was
      # read. scripts/nightly-build.sh checks whether PIL imports and, if it
      # does not, builds the way verify.yml does every day, with the image
      # builders skipped and the committed images kept.
      - name: Python deps for the image builders
        id: pillow
        continue-on-error: true
        run: >-
          bash scripts/nightly-step.sh
          "Pillow did not install, so the share-card images were not redrawn."
          -- python3 -m pip install --quiet Pillow==13.0.0

      # The scripts cache raw API responses here. Restoring it keeps the
      # Pokemon TCG API calls down, since that one rate-limits hard and
      # answers 500 rather than 429 when it is unhappy.
      - name: Restore API cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: api-cache-${{ github.run_id }}
          restore-keys: api-cache-
          # NOTE: `save-always` USED TO BE HERE AND DID NOTHING. It was
          # deprecated and made a no-op in actions/cache >= 4.2 and this
          # workflow floats on @v4, so the one scenario it was added for -- the
          # job ends red, the cache must still save -- is exactly the one where
          # it silently stopped working. Receipts: run 32989362223 (green) has
          # "Post Restore API cache: success"; run 33254818081 (red, today) has
          # it "skipped". The explicit save step at the foot of this job
          # replaces it.

      # SOFT SINCE 9 NOVEMBER 2026, same shape as the intl guides and prices
      # steps. From 4 to 8 November the YouTube Data API answered 403
      # quotaExceeded every night, and because this step was hard and sat first,
      # `-e` killed the job before a single price or page was refreshed: five
      # days of stale prices over a quota on a different service. A refused
      # sync leaves videos.json as it was, check-freshness.mjs still goes red on
      # its 3 day leash, and the warning at the foot of this job names it.
      #
      # EVERY SYNC STEP FROM HERE DOWN IS SOFT AND RUNS THROUGH
      # scripts/nightly-step.sh, since 11 November 2026. Read that script's
      # header. In short: the step still shows as failed, the job carries on,
      # the files that step writes go back to the last committed copy so the
      # build never reads a half-written one, and the sentence in quotes is
      # what the owner is told in the alert issue. A step with no paths after
      # the sentence is one whose script keeps its own last good file.
      # No `if:` reads these outcomes for the restore, on purpose: a typo in
      # an expression evaluates to false in silence.
      - name: New uploads
        id: youtube
        if: env.YT_API_KEY != ''
        continue-on-error: true
        run: >-
          bash scripts/nightly-step.sh
          "The YouTube sync failed, so new rips did not come in."
          data/descriptions.json public/data/videos.json public/data/playlists.json
          -- node scripts/sync-youtube.mjs

      # Free and unauthenticated. --force because the whole point of a nightly
      # run is fresh numbers; without it every set would come back from cache.
      - name: Sealed product prices
        id: products
        continue-on-error: true
        run: >-
          bash scripts/nightly-step.sh
          "Sealed product prices (TCGplayer) did not refresh; last night's stand."
          public/data/products.json public/data/products-intl.json
          -- node scripts/sync-products.mjs --force

      # Free and unauthenticated, and the only source that knows a Japanese set
      # exists. Cached, so this is one request per set after the first run.
      # Collectr's public showcase. Never fails the build: if the endpoint moves
      # or sharing gets switched off, the committed copy stands and the page
      # says when it was last updated.

      - name: Foreign-language sets
        id: intl
        continue-on-error: true
        run: >-
          bash scripts/nightly-step.sh
          "The foreign-language set list (TCGdex) did not refresh; last night's stands."
          public/data/intl-sets.json
          -- node scripts/sync-intl.mjs

      # The guides for sets we have actually opened packs of. Heavily cached:
      # the first run made about 2,250 requests across TCGdex and PokeAPI, every
      # run since makes zero. Only a brand new foreign set costs anything.
      # ONE BAD GUIDE MUST NOT STOP THE OTHER 1,490 PAGES GOING STALE.
      # This step exits 1 when a guide would publish a card count with an empty
      # checklist, which is the right thing to shout about -- but it sat sixth
      # in a pipeline of fourteen, so `-e` killed the run before ANY page was
      # rebuilt. zh-gem-pack-2 has tripped it since 20 August because TCGdex
      # returns no card list for zh-cn/CBB2C while its own response declares 15
      # cards, and that is upstream and not fixable here: refetched today, still
      # zero. So one Chinese set with 15 cards froze every price, every date and
      # every new video on the site for five days.
      #
      # continue-on-error KEEPS THE SIGNAL AND DROPS THE BLAST RADIUS: the data
      # still refreshes, and the last step below re-raises this into a red job
      # so it cannot become something nobody sees.
      # No paths: this script writes its file in full and THEN exits 1 to flag
      # a bad guide, so what is on disk is tonight's good data and stays.
      - name: Non-English set guides
        id: intl_guides
        continue-on-error: true
        run: >-
          bash scripts/nightly-step.sh
          "The non-English set guides sync reported bad data for at least one guide."
          -- node scripts/sync-intl-guides.mjs

      # NO PRICECHARTING STEPS FROM 13 NOVEMBER 2026. Two steps stood here: the
      # nightly read of PriceCharting's set pages (refresh-prices.mjs) and the
      # parse of those pages into card prices (sync-pricecharting-cards.mjs).
      # PriceCharting requires a paid plan to show their prices and the owner
      # declined; see shared/no-pricecharting.mjs. Card prices are TCGplayer's
      # via TCGdex in "Card checklists and prices" below.

      # 30th CELEBRATION, added 14 October 2026. The set is in no TCGdex set
      # sync-cards.mjs can reach and in no console refresh-prices.mjs reads, so
      # it has its own two scripts and until today they ran only by hand. The
      # 13 October "full refresh" missed them and the same card printed three
      # prices from three dates (Jirachi ex 155: $67.33 on the set page, $65.67
      # on its rip page, $48.99 in graded.json). Two console pages plus eight
      # promo pages at 1.1s, then one TCGdex set read and two GraphQL pages.
      # continue-on-error like the prices step: a refused read keeps the last
      # good file (both scripts refuse to write a thinner one) and its own date.
      - name: 30th Celebration prices
        id: thirtieth_prices
        continue-on-error: true
        run: >-
          bash scripts/nightly-step.sh
          "30th Celebration prices did not refresh; the last read stands."
          data/30th-prices.json
          -- node scripts/sync-30th-prices.mjs

      - name: 30th Celebration card file
        id: thirtieth_cards
        continue-on-error: true
        run: >-
          bash scripts/nightly-step.sh
          "The 30th Celebration card file did not refresh; the last one stands."
          public/data/cards/30th-celebration.json
          -- node scripts/sync-30th-card-data.mjs

      # THE ONE THAT WRITES 29 FILES AND AN INDEX, so the one a crash can leave
      # half done: it writes a card file per set as it goes and card-index.json
      # last. On a crash every card file and the index go back to HEAD together
      # (the 30th file is excluded: the step above owns it and it may be new).
      # KEEP_IF_LOGGED: the script also exits 1 on purpose AFTER writing a full,
      # consistent set, when a checklist came back smaller and was not
      # overwritten. Its last progress line is the proof it got that far, and
      # then the files are kept and only the note is raised.
      - name: Card checklists and prices
        id: cards
        continue-on-error: true
        env:
          KEEP_IF_LOGGED: "Wrote public/data/cards/*.json and card-index.json"
        run: >-
          bash scripts/nightly-step.sh
          "Card checklists and prices (TCGdex) did not fully refresh."
          public/data/card-index.json public/data/cards
          ":(exclude)public/data/cards/30th-celebration.json"
          -- node scripts/sync-cards.mjs --prices --rotate

      # MUST follow sync-cards and precede sync-chase. Makes TCGdex the single
      # source of truth for prices by pushing them into sets.json and
      # chase-tcg.json, so no two pages can quote the same card differently.
      # If this fails, the card files go back to HEAD WITH sets.json and
      # wanted.json, not only the two files it writes: its whole job is to
      # make those agree, and tonight's card files beside last night's
      # sets.json is exactly the disagreement it exists to prevent. Last
      # night's set of all four agrees with itself. It reads only local files.
      - name: One price and one image per card
        id: reconcile
        continue-on-error: true
        run: >-
          bash scripts/nightly-step.sh
          "The card price reconcile failed, so every card file went back to last night's copy."
          public/data/sets.json public/data/wanted.json
          public/data/card-index.json public/data/cards
          ":(exclude)public/data/cards/30th-celebration.json"
          -- node scripts/reconcile-cards.mjs

      - name: Preorder prices for upcoming sets
        id: preorders
        continue-on-error: true
        run: >-
          bash scripts/nightly-step.sh
          "Preorder prices (TCGplayer) did not refresh; last night's stand."
          public/data/preorders.json
          -- node scripts/sync-preorders.mjs --force

      # Link-only: a TCGplayer product url per collector number, for every set
      # with a checklist. It writes no price and no card name, so there is
      # nothing here for reconcile-cards.mjs to undo afterwards. The second
      # reconcile pass that used to follow this step existed purely for that and
      # is gone.
      - name: TCGplayer product links
        id: chase
        continue-on-error: true
        run: >-
          bash scripts/nightly-step.sh
          "TCGplayer product links did not refresh; last night's stand."
          data/chase-tcg.json
          -- node scripts/sync-chase.mjs --force

      # 100 credits a day on the free tier and 2 credits per card, so 50 is the
      # daily ceiling. The script resumes rather than restarting, so it works
      # through the backlog a night at a time.
      # No paths: it resumes from its own file, 50 cards a night.
      - name: PSA 10 prices
        id: psa10
        if: env.PPT_API_KEY != ''
        continue-on-error: true
        run: >-
          bash scripts/nightly-step.sh
          "PSA 10 prices (pokemonpricetracker.com) did not refresh tonight."
          -- node scripts/sync-prices.mjs --limit 50

      # ONE LIST, NOT TWO. This step used to enumerate every builder by hand,
      # duplicating the list in scripts/build-all.mjs, whose own header says the
      # list is kept in one place "so there is one running order, not two that
      # drift". They drifted anyway. On 14 August 2026 the copy here was missing
      # FIVE steps that build-all.mjs runs:
      #
      #   stamp-assets.mjs   runs LAST and content-hashes the asset filenames,
      #                      so every nightly commit was shipping pages whose
      #                      ?v= cache busters did not match the files
      #   build-games.mjs    the four games
      #   build-lore.mjs     the Pokedex facts page
      #   build-locals.mjs   creators.html and vendors.html
      #   stamp-labels.mjs
      #
      # Nothing caught it because check-build.py checks that the pages present
      # are sound, not that every builder ran. So the nightly job quietly left
      # six pages frozen at whatever the last manual build produced.
      #
      # build-all.mjs already runs sync-chrome first, build-css before any page
      # builder, build-intl-pages after build-set-pages (which clears
      # public/sets/), and stamp-assets last, with the reasons written next to
      # each. Calling it is what keeps this workflow correct by construction:
      # a builder added to build-all.mjs is a builder the nightly runs.
      #
      # A DEGRADED NIGHT STILL COMMITS, since 11 November 2026. This used to be
      # a bare `node scripts/build-all.mjs`, so one builder throwing on one new
      # word in tonight's data ended the job with no commit at all.
      # scripts/nightly-build.sh builds on tonight's data and, if that fails,
      # puts the tree back to HEAD and builds again on the last good data. If
      # that passes the job carries on GREEN, commits and deploys (dates roll,
      # tonight's prices and videos do not), and the alert issue names the
      # builder that failed. If both builds fail the fault is in the source and
      # this step fails as it always did: no commit, red job, no deploy.
      - name: Rebuild every page
        id: build
        # The build command stays on this line: check-build.py fails the build
        # if this file stops naming scripts/build-all.mjs outside a comment.
        run: bash scripts/nightly-build.sh node scripts/build-all.mjs

      # Cheap guards. A nightly job that commits unattended should not be able
      # to publish a broken site quietly.
      # EXIT 2 IS A WRONG CELL IN THE WORKBOOK AND IT MUST NOT STOP THIS JOB.
      # check-build.py exits 1 for a broken build and 2 for a workbook answer
      # that needs a human -- pages complete and publishable, the log simply
      # wrong about a card. The "Commit if anything changed" step comes after
      # this one, so treating 2 as fatal would let one mistyped rarity halt
      # every nightly commit: new uploads, sealed prices, PSA figures, all of
      # it. pages.yml would not deploy either, because its workflow_run trigger
      # requires conclusion == success. This site has already lost twelve days
      # of publishing to a freeze nobody could see. The message still prints in
      # full above, and on every local build, so it stays loud while it waits.
      #
      # check-build.py IS NOT RUN A SECOND TIME HERE ANY MORE, 11 November 2026.
      # It is the last step of build-all.mjs, which exits 1 when it exits 1,
      # carries on when it exits 2, and prints the problems it found in both
      # cases, so the copy that stood here re-read 1,500 pages to learn what
      # the step above had just said. Everything written above about exit 2 still holds; the
      # ::warning for it moved into scripts/nightly-build.sh.
      - name: Check the build
        run: node scripts/sync-chrome.mjs --check

      # A PUSH RACE IS RESOLVED BY REBUILDING, NEVER BY MERGING.
      #
      # The first version of this rebased and retried, on the argument that
      # this job "only ever ADDS generated output". Measured against real
      # history, that is false and not marginally: a bot commit touches
      # 1,164 to 1,172 files, and human commits pushed the same day
      # overlapped it by 1,113, 1,113, 1,113, 261 and 88. Replaying one real
      # rip post across one real bot diff conflicts on 14 files; a site-wide
      # rebuild conflicts on 1,497, because stamp-assets.mjs rewrites the
      # ?v= line on every page from both sides. Conflict is the COMMON case
      # here, and on a conflict the loop bailed and the night was lost
      # anyway.
      #
      # A CLEAN rebase was worse. Human edits a builder, bot commits pages
      # built from the OLD builder, git merges them happily, and the pushed
      # tree is new source with stale output -- the source/output drift
      # verify.yml calls "this repo's worst documented failure mode", now
      # published immediately because pages.yml deploys on workflow_run.
      #
      # So: throw the bot's commit away, take theirs, REBUILD, and commit
      # the result. Generated files are never merged, so they cannot
      # conflict and cannot drift from the source they came from.
      #
      # THE LOOP LIVES IN scripts/nightly-push.sh SINCE 11 NOVEMBER 2026, and
      # one thing about it changed. It used to `git reset --hard HEAD~1`, pull
      # and run ONLY build-all, which threw away every file the syncs had just
      # written and never ran them again: a raced night committed a date roll
      # at most, and the job was green. The script now keeps tonight's synced
      # DATA files through the race (only the groups the other push did not
      # touch; a person's edit always wins) and still rebuilds every page from
      # scratch on top of their push. Nothing generated is merged, as above.
      - name: Commit if anything changed
        id: commit
        run: bash scripts/nightly-push.sh

      # RE-RAISED HERE, NOT SWALLOWED. Everything above has run and the refresh
      # is committed; this is only about the exit status the run reports, so it
      # goes last. A red job with the site refreshed beats a green job with the
      # site five days stale, and beats a dead pipeline either way.
      # THIS DELIBERATELY DOES *NOT* FAIL THE RUN, AND THAT REVERSES THE LAST
      # COMMIT. It was written to copy the intl_guides re-raise below, and the
      # copy was wrong because the blast radius is not the same. pages.yml
      # deploys the nightly's commit through `workflow_run` gated on
      # `conclusion == 'success'` (the default GITHUB_TOKEN raises no push
      # event, which is why that trigger exists at all). So failing this job on
      # a PriceCharting outage does not just flag stale prices, it BLOCKS THE
      # WHOLE SITE FROM PUBLISHING: new rips, sealed prices, show listings, all
      # committed and none deployed. A total block reproduces every night, so
      # the freeze would sustain itself until somebody noticed. The step three
      # above argues this exact case in capitals: "This site has already lost
      # twelve days of publishing to a freeze nobody could see."
      #
      # THE SIGNAL SURVIVES WITHOUT THE BLAST RADIUS, which is the whole point
      # of continue-on-error here. A refused hot tier does not move each set's
      # read date, so check-freshness.mjs goes red on the next push and on its
      # own schedule, and the site keeps publishing everything that DID work
      # with prices honestly dated to their real read.
      # THE CACHE SAVE, EXPLICIT AND UNCONDITIONAL, because the built-in one
      # only runs when the job is green and this job can end red on purpose.
      # Without it a night that re-raises commits `state.refreshed[path] =
      # today` for the cold consoles while discarding the pages behind those
      # bookmarks, so the rotation skips them for a month.
      - name: Keep the API cache even if this job ends red
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: api-cache-${{ github.run_id }}

      # DOWNGRADED FROM A FAILURE TO A WARNING, for the reason the price step
      # three above already gives. The bot's commit has ALREADY landed on main
      # by the time this runs, and its push raises no push event, so pages.yml
      # only ever deploys it through workflow_run gated on conclusion ==
      # success. Failing here therefore does not flag bad data, it BLOCKS THE
      # COMMIT FROM EVER PUBLISHING -- and if the underlying guide problem is
      # persistent, as zh-gem-pack-2 was from 20 August, it reproduces nightly
      # and the freeze sustains itself. That is the twelve-day freeze this file
      # warns about, with a different trigger.
      - name: Say so if the YouTube sync did not happen
        if: steps.youtube.outcome == 'failure'
        run: |
          echo "::warning title=YouTube sync skipped::sync-youtube.mjs exited non-zero (usually quotaExceeded)."
          echo "videos.json keeps its last copy; everything else still refreshed and deploys."
          echo "check-freshness.mjs goes red if this persists past its 3 day leash."

      - name: Say so if a sync reported bad data
        if: steps.intl_guides.outcome == 'failure'
        run: |
          echo "::warning title=Sync reported bad data::sync-intl-guides.mjs exited non-zero."
          echo "The refresh above still ran and committed, and the site still deploys."
          echo "Read the 'Non-English set guides' step for which guide and why."

      # THE ALERT, 11 November 2026. From 4 to 8 November this job was red five
      # nights running and nobody was told: a red X on the Actions tab is only
      # a signal to somebody looking at the Actions tab. One open issue titled
      # below gets a comment per bad night, naming what failed and linking the
      # run, and a clean night closes it. GitHub emails issue activity to the
      # repository's watchers, which is the whole mechanism; no outside service.
      # It never fails the job, so it cannot itself block a deploy.
      #
      # WHAT IT SAYS COMES FROM A NOTES FILE, since later the same day. Every
      # soft step that fails, a degraded build and a skipped image build each
      # append one plain sentence to $RUNNER_TEMP/nightly-notes.txt (see
      # scripts/nightly-step.sh and scripts/nightly-build.sh). This step posts
      # those sentences plus the job's own status. It used to read two step
      # outcomes by name and so could only ever name YouTube and prices.
      # scripts/alert-issue.sh holds the open, comment and close logic, shared
      # with verify.yml.
      - name: Tell the owner when the nightly is not healthy
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          what=""
          if [ "$JOB_STATUS" != "success" ]; then what="The job ended $JOB_STATUS, so the site may not have refreshed at all."; fi
          notes="${NIGHTLY_NOTES:-$RUNNER_TEMP/nightly-notes.txt}"
          if [ -s "$notes" ]; then what="$what $(tr '\n' ' ' < "$notes")"; fi
          what="$(printf '%s' "$what" | sed -e 's/^ *//' -e 's/ *$//')"
          bash scripts/alert-issue.sh "Nightly refresh is not healthy" "$what"
