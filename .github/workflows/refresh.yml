# Nightly refresh: pull new videos and new prices, rebuild, commit.
#
# The site is static HTML with every price baked in at build time, so without
# this nothing ever changes on its own: a new upload does not appear and a
# price is however old the last manual run was. Deploy is a separate workflow
# that fires on any push to main, so committing here is what publishes.
#
# Runs once a day at 9am in Rochester. It is scheduled as TWO crons, 13:00 and
# 14:00 UTC, and a guard in the job ends the run on whichever one is not 9am
# Eastern that day, so the time is fixed LOCALLY and a change to the daylight
# saving rules needs no edit. See the schedule and the guard below.
#
# (This said "07:10 UTC, about 3am in Rochester" until 19 August 2026, which was
# contradicted by the cron twenty lines below it in this same file. DEPLOY.md
# carried the same stale claim and was corrected without this being noticed.)
#
# SECRETS THIS NEEDS  (Settings -> Secrets and variables -> Actions)
#   YT_API_KEY    YouTube Data API v3, for new uploads
#   PPT_API_KEY   pokemonpricetracker.com, for PSA 10 prices
# Both steps are skipped automatically when their secret is absent, so the
# TCGplayer half still runs on a fork or before the keys are added.
name: Nightly refresh

# 9am Eastern, every day, which is what the owner asked for on 17 August 2026.
#
# GITHUB CRON IS UTC AND HAS NO CONCEPT OF DAYLIGHT SAVING, so one line cannot
# be 9am Eastern all year. Two are scheduled instead, 13:00 and 14:00 UTC, and
# the job's first step exits early on whichever one is not 9am in New York
# today. That keeps it at 9am through both halves of the year rather than
# drifting to 8am every November.
#
# It used to be a single "10 7 * * *", which is 3:10am Eastern in summer.
#
# GitHub also runs scheduled jobs late when the fleet is busy, sometimes by
# tens of minutes, and drops them entirely on a repository with no activity for
# 60 days. Neither is fixable from here; workflow_dispatch below is the manual
# fallback and the sync is safe to run twice.
on:
  schedule:
    # NOT ON THE HOUR, AND THAT IS THE WHOLE REASON THESE READ 13:17 / 14:17.
    # GitHub queues every "0 * * * *" job in the world at once, so a run booked
    # on the hour is delayed and, under load, DROPPED. Measured here: the runs
    # that did fire started 2.5 to 3 hours late (15:26, 16:36, 16:55 UTC), and
    # on 27 and 28 August 2026 neither cron fired at all, so the site went two
    # days with no refresh and nothing went red. Seventeen past is quiet.
    - cron: "17 13 * * *"
    - cron: "17 14 * * *"
  workflow_dispatch:
    inputs:
      force_prices:
        description: "Refetch TCGplayer prices even if cached"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  # WHICH CRON IS 9am IN NEW YORK IS DECIDED BY THE DST OFFSET, NOT BY THE CLOCK
  # WHEN THE JOB HAPPENS TO START. The old guard asked the runner what hour it
  # was and stopped unless the answer was exactly "09". GitHub then ran these
  # crons late -- measured over five days, between 54 minutes and 3 hours 3
  # minutes late -- so on three of those five days BOTH crons woke up past 09
  # and the refresh never ran at all.
  #
  # github.event.schedule NAMES THE CRON THAT FIRED, and it is stamped at
  # trigger time, so a late start cannot change it. Pair that with the current
  # UTC offset -- -0400 in summer, -0500 in winter -- and exactly one of the two
  # crons is the 9am one on any given day, however late either arrives.
  #
  # AND SKIPPING IS NOT FAILING. The old guard called `exit 1` on the cron it
  # did not want, so this workflow went red EVERY SINGLE DAY as designed. That
  # is why nobody noticed it had also been genuinely broken since 20 August: a
  # real failure looked exactly like the normal one. A gate job that outputs a
  # flag leaves the unwanted run marked "skipped", so red means broken again.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.decide.outputs.go }}
    steps:
      - id: decide
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual run; never gated."
            echo "go=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          offset=$(TZ=America/New_York date +%z)
          if [ "$offset" = "-0500" ]; then want="17 14 * * *"; else want="17 13 * * *"; fi
          fired="${{ github.event.schedule }}"
          echo "New York offset $offset, so the 9am cron today is '$want'. This run is '$fired'."
          if [ "$fired" = "$want" ]; then
            echo "go=1" >> "$GITHUB_OUTPUT"
          else
            echo "Not today's 9am cron. Skipping, which is not a failure."
            echo "go=0" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    # Same reasoning as the timeout in pages.yml, and it matters more here:
    # this workflow is what TRIGGERS the deploy, so a run wedged in this
    # concurrency group stops publishing just as completely as a wedged deploy
    # does, and just as quietly. Generous, because the job talks to the
    # YouTube and PriceCharting APIs and then rebuilds ~1,480 pages.
    timeout-minutes: 45
    # Job level, not step level: a step's own env: block is NOT in scope for
    # that step's own if:, so the skip-when-absent guards below would never
    # fire and the steps would run keyless and fail.
    env:
      YT_API_KEY: ${{ secrets.YT_API_KEY }}
      PPT_API_KEY: ${{ secrets.PPT_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # PYTHON AND PILLOW, BECAUSE build-all.mjs RUNS A PYTHON BUILDER.
      # scripts/build-og-pages.py draws the per-page social cards and imports
      # PIL. Without this the runner has no Pillow, that builder throws
      # ModuleNotFoundError, build-all.mjs exits 1, and the commit step is
      # skipped, so every sync above it runs successfully and is then thrown
      # away. That is what happened on 13, 14 and 15 August 2026: three
      # consecutive nightly runs did all the work and committed nothing.
      # If you add another Python builder, check its imports are installed here.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python deps for the image builders
        run: python3 -m pip install --quiet Pillow

      # The scripts cache raw API responses here. Restoring it keeps the
      # Pokemon TCG API calls down, since that one rate-limits hard and
      # answers 500 rather than 429 when it is unhappy.
      - name: Restore API cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: api-cache-${{ github.run_id }}
          restore-keys: api-cache-

      - name: New uploads
        if: env.YT_API_KEY != ''
        run: node scripts/sync-youtube.mjs

      # Free and unauthenticated. --force because the whole point of a nightly
      # run is fresh numbers; without it every set would come back from cache.
      - name: Sealed product prices
        run: node scripts/sync-products.mjs --force

      # Free and unauthenticated, and the only source that knows a Japanese set
      # exists. Cached, so this is one request per set after the first run.
      # Collectr's public showcase. Never fails the build: if the endpoint moves
      # or sharing gets switched off, the committed copy stands and the page
      # says when it was last updated.

      - name: Foreign-language sets
        run: node scripts/sync-intl.mjs

      # The guides for sets we have actually opened packs of. Heavily cached:
      # the first run made about 2,250 requests across TCGdex and PokeAPI, every
      # run since makes zero. Only a brand new foreign set costs anything.
      # ONE BAD GUIDE MUST NOT STOP THE OTHER 1,490 PAGES GOING STALE.
      # This step exits 1 when a guide would publish a card count with an empty
      # checklist, which is the right thing to shout about -- but it sat sixth
      # in a pipeline of fourteen, so `-e` killed the run before ANY page was
      # rebuilt. zh-gem-pack-2 has tripped it since 20 August because TCGdex
      # returns no card list for zh-cn/CBB2C while its own response declares 15
      # cards, and that is upstream and not fixable here: refetched today, still
      # zero. So one Chinese set with 15 cards froze every price, every date and
      # every new video on the site for five days.
      #
      # continue-on-error KEEPS THE SIGNAL AND DROPS THE BLAST RADIUS: the data
      # still refreshes, and the last step below re-raises this into a red job
      # so it cannot become something nobody sees.
      - name: Non-English set guides
        id: intl_guides
        continue-on-error: true
        run: node scripts/sync-intl-guides.mjs

      # Full card checklists and prices for the 23 English sets, 4,481 cards.
      # --rotate does a quarter of the sets per night so every one is current
      # within four days without making 4,500 requests to a free API daily.
      - name: Card checklists and prices
        run: node scripts/sync-cards.mjs --prices --rotate

      # MUST follow sync-cards and precede sync-chase. Makes TCGdex the single
      # source of truth for prices by pushing them into sets.json and
      # chase-tcg.json, so no two pages can quote the same card differently.
      - name: One price and one image per card
        run: node scripts/reconcile-cards.mjs

      - name: Preorder prices for upcoming sets
        run: node scripts/sync-preorders.mjs --force

      # Link-only: a TCGplayer product url per collector number, for every set
      # with a checklist. It writes no price and no card name, so there is
      # nothing here for reconcile-cards.mjs to undo afterwards. The second
      # reconcile pass that used to follow this step existed purely for that and
      # is gone.
      - name: TCGplayer product links
        run: node scripts/sync-chase.mjs --force

      # 100 credits a day on the free tier and 2 credits per card, so 50 is the
      # daily ceiling. The script resumes rather than restarting, so it works
      # through the backlog a night at a time.
      - name: PSA 10 prices
        if: env.PPT_API_KEY != ''
        run: node scripts/sync-prices.mjs --limit 50
        continue-on-error: true

      # ONE LIST, NOT TWO. This step used to enumerate every builder by hand,
      # duplicating the list in scripts/build-all.mjs, whose own header says the
      # list is kept in one place "so there is one running order, not two that
      # drift". They drifted anyway. On 14 August 2026 the copy here was missing
      # FIVE steps that build-all.mjs runs:
      #
      #   stamp-assets.mjs   runs LAST and content-hashes the asset filenames,
      #                      so every nightly commit was shipping pages whose
      #                      ?v= cache busters did not match the files
      #   build-games.mjs    the four games
      #   build-lore.mjs     the Pokedex facts page
      #   build-locals.mjs   creators.html and vendors.html
      #   stamp-labels.mjs
      #
      # Nothing caught it because check-build.py checks that the pages present
      # are sound, not that every builder ran. So the nightly job quietly left
      # six pages frozen at whatever the last manual build produced.
      #
      # build-all.mjs already runs sync-chrome first, build-css before any page
      # builder, build-intl-pages after build-set-pages (which clears
      # public/sets/), and stamp-assets last, with the reasons written next to
      # each. Calling it is what keeps this workflow correct by construction:
      # a builder added to build-all.mjs is a builder the nightly runs.
      - name: Rebuild every page
        run: node scripts/build-all.mjs

      # Cheap guards. A nightly job that commits unattended should not be able
      # to publish a broken site quietly.
      # EXIT 2 IS A WRONG CELL IN THE WORKBOOK AND IT MUST NOT STOP THIS JOB.
      # check-build.py exits 1 for a broken build and 2 for a workbook answer
      # that needs a human -- pages complete and publishable, the log simply
      # wrong about a card. The "Commit if anything changed" step comes after
      # this one, so treating 2 as fatal would let one mistyped rarity halt
      # every nightly commit: new uploads, sealed prices, PSA figures, all of
      # it. pages.yml would not deploy either, because its workflow_run trigger
      # requires conclusion == success. This site has already lost twelve days
      # of publishing to a freeze nobody could see. The message still prints in
      # full above, and on every local build, so it stays loud while it waits.
      - name: Check the build
        run: |
          node scripts/sync-chrome.mjs --check
          python3 scripts/check-build.py || {
            code=$?
            if [ "$code" -ne 2 ]; then exit "$code"; fi
            echo "::warning::check-build.py exit 2: the workbook needs a fix (see above). Continuing, because the build itself is sound."
          }

      - name: Commit if anything changed
        run: |
          git config user.name "garbage-rips-bot"
          git config user.email "bot@garbagerips585.invalid"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed today."
            exit 0
          fi
          git commit -m "Nightly refresh: $(date -u +%Y-%m-%d)

          $(git diff --cached --stat | tail -1)"
          git push

      # RE-RAISED HERE, NOT SWALLOWED. Everything above has run and the refresh
      # is committed; this is only about the exit status the run reports, so it
      # goes last. A red job with the site refreshed beats a green job with the
      # site five days stale, and beats a dead pipeline either way.
      - name: Fail the run if a sync reported bad data
        if: steps.intl_guides.outcome == 'failure'
        run: |
          echo "sync-intl-guides.mjs exited non-zero. The refresh above still ran and"
          echo "committed; this step exists so the bad data is not invisible."
          echo "Read the 'Non-English set guides' step for which guide and why."
          exit 1
