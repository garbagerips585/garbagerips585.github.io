# Publish public/ to GitHub Pages on every push to main.
#
# The site's deploy root is public/, and GitHub Pages' branch-based setting can
# only serve the repo root or /docs. Deploying from Actions instead lets us keep
# the layout the project already has: scripts/, data/ and assets-source/ stay in
# the repo without being served, and only public/ goes up.
#
# (This used to say the layout mattered "because functions/ has to live OUTSIDE
# the served directory". functions/ was the Cloudflare half and is deleted; the
# reason is now simply that the generated site lives in a subdirectory.)
#
# There is no build step: every page is generated locally by the scripts in
# scripts/ and committed. This workflow only uploads what is already there.

name: Deploy to GitHub Pages

# WHY workflow_run IS HERE AND WHY THE SITE WENT STALE WITHOUT IT.
# A push made by a workflow using the default GITHUB_TOKEN deliberately does
# NOT trigger other workflows: GitHub blocks that to stop runs recursing. So
# the nightly refresh could commit fresh prices and video data to main and this
# deploy would simply never fire. Exactly one bot commit ever landed and it
# appears in none of the Pages deployments.
# workflow_run is the supported way out: it fires on the REFRESH RUN finishing
# rather than on the push it made, so no token can suppress it. The `if` keeps
# a failed refresh from publishing.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Nightly refresh"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it, so a half-uploaded
# site is never what is live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Do not publish the output of a refresh that FAILED. On a push or a manual
    # run there is no parent run to check, so the condition passes.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # A TIMEOUT IS WHAT KEEPS `cancel-in-progress: false` FROM BECOMING A
    # PERMANENT OUTAGE. On 2026-08-06 a transient GitHub Actions incident left
    # one deploy wedged in `waiting` on a sibling project. Because the
    # concurrency group refuses to cancel a running deploy, that one run held
    # the group forever: 29 later runs queued behind it and were dropped as
    # intermediates, and the site served a 12-day-old build. Nothing failed.
    # No red X, no email; Pages simply kept serving the last good copy while
    # every push after it silently went nowhere.
    # With a timeout the wedged run dies on its own and the queue drains.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # The IndexNow step at the foot of this job runs a node script, and this
      # job never had node. ubuntu-latest ships one, but pinning it to the same
      # 24 verify.yml uses is what stops a runner image bump from quietly
      # breaking a step whose failures are swallowed by continue-on-error.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4

      # TELL INDEXNOW WHAT CHANGED, AFTER THE DEPLOY AND NOT BEFORE. Announcing a
      # url before it is live invites a crawl of the old copy, or of a 404, which
      # is worse than not announcing it at all. This step runs only once
      # deploy-pages has reported success.
      #
      # `continue-on-error` IS DELIBERATE AND IS THE WHOLE POINT OF PUTTING IT
      # LAST. The site is published and correct by the time this runs. A search
      # engine ping that times out is not a broken deploy, and a red X here would
      # train us to ignore red X's on the workflow that actually matters.
      #
      # fetch-depth 2, because the script diffs HEAD~1..HEAD to find what changed
      # and the default checkout is a single commit with no parent to diff.
      - name: Tell IndexNow which pages changed
        continue-on-error: true
        run: |
          git fetch --deepen=1 --quiet || true
          node scripts/indexnow.mjs
